name: Package and Release

on:
  push:
    branches:
      - master
    tags:
      - "**"

  workflow_dispatch:

permissions:
  contents: write

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2.5.1

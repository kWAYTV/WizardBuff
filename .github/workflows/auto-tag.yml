name: Auto Tag

on:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Bump version and tag
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          latest=$(git tag -l --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -1)
          if [ -z "$latest" ]; then
            next="1.0.0"
          else
            IFS='.' read -r major minor patch <<< "$latest"
            patch=${patch:-0}
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Tagging $next"
          sed -i "s/^## Version: .*/## Version: $next/" WizardBuff.toc
          git add WizardBuff.toc
          git commit -m "chore: stamp version $next"
          git tag -a "$next" -m "Release $next"
          git push origin master --tags
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Trigger release workflow
        run: gh workflow run release.yml --ref "${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
